# TechpioAsset — monitoring stack (v3.20): Prometheus + Grafana, all open source,
# all self-hosted on the same VPS. Nothing here is paid or phones home.
#
#   setup:    ./setup.sh            (first time; idempotent, see README.md)
#   start:    docker compose -f docker-compose.monitoring.yml --env-file .env.monitoring up -d
#   grafana:  https://<GRAFANA_PUBLIC_HOST>/grafana/   (via the host's nginx)
#
# Exposure, deliberately minimal:
#   • Grafana and Prometheus bind to 127.0.0.1 only; nginx fronts Grafana with
#     TLS and Grafana's own login. Prometheus has no login and stays local
#     (reach it with an SSH tunnel if you ever need the raw UI).
#   • The exporters publish nothing to the host at all; Prometheus scrapes them
#     over the private `monitoring` network.
#   • Prometheus also joins the two application networks, which is how it
#     reaches each API's internal metrics port (9464) - a port those compose
#     files never publish, so the per-company counts never touch the internet.
#
# Footprint: ~500 MB RAM across the six containers, ≤4 GB disk for 30 days of
# samples (both capped below so a busy month cannot fill the disk).

name: techpioasset-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=4GB
      # Lets `curl -X POST localhost:9090/-/reload` apply a config edit without a restart.
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - monitoring
      - pioassets
      - pioassets-staging
    mem_limit: 1g

  grafana:
    image: grafana/grafana-oss:12.1.1
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file: .env.monitoring
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # No telemetry, no update pings: nothing leaves the server.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      # Alert email. Off until GRAFANA_SMTP_* are filled in .env.monitoring;
      # the contact point is provisioned either way so turning it on is an
      # env edit and a restart, not a click-through.
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-grafana@localhost}
      GF_SMTP_FROM_NAME: PioAssets monitoring
      # Read by the provisioned contact point (grafana/provisioning/alerting).
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3300:3000'
    networks:
      - monitoring
    mem_limit: 512m

  # Host CPU, memory, disk, load. Reads the host's /proc and /sys through a
  # read-only mount; pid:host so process counts are the host's. Network
  # interface counters are left out on purpose: from inside a bridge network
  # they would describe the container, not the host, and a wrong number is
  # worse than none (cAdvisor below has per-container network).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(host/)?(sys|proc|dev|run|var/lib/docker/.+|snap/.+)($$|/)
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.arp
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    mem_limit: 128m

  # Per-container CPU, memory, network and restarts. Needs the Docker socket
  # and cgroups, read-only; --docker_only keeps the host's own cgroups out.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    mem_limit: 256m

  # One exporter per database, each connecting as the read-only monitor role
  # that setup.sh creates (pg_monitor: statistics views only, never table rows).
  postgres-exporter-prod:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: techpioasset-postgres-1:5432/${MONITOR_DB_NAME_PROD}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD_PROD}
    networks:
      - monitoring
      - pioassets
    mem_limit: 128m

  postgres-exporter-staging:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: techpioasset-staging-postgres-1:5432/${MONITOR_DB_NAME_STAGING}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER}
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD_STAGING}
    networks:
      - monitoring
      - pioassets-staging
    mem_limit: 128m

networks:
  monitoring: {}
  # The application stacks' own networks, joined so Prometheus and the
  # database exporters can reach containers that publish nothing to the host.
  pioassets:
    external: true
    name: techpioasset_default
  pioassets-staging:
    external: true
    name: techpioasset-staging_default

volumes:
  prometheus-data:
  grafana-data:
