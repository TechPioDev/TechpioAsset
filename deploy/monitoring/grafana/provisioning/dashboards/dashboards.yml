apiVersion: 1

providers:
  - name: PioAssets
    orgId: 1
    folder: PioAssets
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    # Dashboards are generated by ../../build-dashboards.py and committed; edits
    # made in the UI are not saved back (allowUiUpdates false), so the repo
    # stays the source of truth. Copy a dashboard to experiment.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
