# nginx site for pioassets.com - reverse-proxies to the TechpioAsset containers
# (web on 127.0.0.1:3000, api on 127.0.0.1:3001). piotask.com remains as a
# permanent redirect for pages and a live API host for installed agents.

server {
    server_name pioassets.com;

    client_max_body_size 30m;

    location = /downloads/techpioasset.apk {
        alias /var/www/piotask-downloads/techpioasset.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="techpioasset.apk"';
    }

    # Which version the APK above is, written by deploy/build-apk-vps.sh. Never
    # cached: it changes with every build and exists to be believed.
    location = /downloads/techpioasset.json {
        alias /var/www/piotask-downloads/techpioasset.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Invoice upload runs AI extraction, so this one request legitimately takes
    # far longer than any other. A one-page text bill measured 14.5s against
    # Claude; a multi-page scan - exactly the kind worth extracting - takes
    # longer, and client_max_body_size above allows 30m of it. nginx defaults to
    # 60s, and timing out here is worse than a slow response: the API carries on,
    # saves the extraction and charges for it, while the uploader sees an error
    # and retries into a second charge.
    #
    # Scoped to the one endpoint by an exact match, which takes precedence over
    # the /api/ prefix below, so nothing else gains a three-minute grace period.
    location = /api/v1/invoices/upload {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pioassets.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pioassets.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name www.pioassets.com;
    return 301 https://pioassets.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pioassets.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pioassets.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pioassets.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name pioassets.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}

server {
    if ($host = www.pioassets.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name www.pioassets.com;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}