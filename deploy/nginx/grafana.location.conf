# v3.20 - Grafana (the monitoring UI) under /grafana/ on the main site.
#
# Include INSIDE the TLS server block of the site, before `location / {`:
#     include /opt/techpioasset/deploy/nginx/grafana.location.conf;
# then `nginx -t && systemctl reload nginx`.
#
# Grafana runs with serve_from_sub_path, so the /grafana/ prefix is passed
# through unchanged (proxy_pass without a trailing path). Grafana enforces its
# own login; the staging site's basic-auth gate is switched off here so the
# same include works on both sites (the directive is harmless where no gate
# exists).
location /grafana/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live panels stream over a websocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location = /grafana {
    return 301 /grafana/;
}
