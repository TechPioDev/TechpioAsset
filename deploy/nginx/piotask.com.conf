# nginx site for piotask.com — reverse-proxies to the TechpioAsset containers
# (web on 127.0.0.1:3000, api on 127.0.0.1:3001). Coexists with PioDeploy; do
# not touch the existing piodeploy.com config.
#
# Install on the VPS:
#   cp deploy/nginx/piotask.com.conf /etc/nginx/sites-available/piotask.com
#   ln -sf /etc/nginx/sites-available/piotask.com /etc/nginx/sites-enabled/piotask.com
#   nginx -t && systemctl reload nginx
# Then, once piotask.com DNS points at this server:
#   certbot --nginx -d piotask.com          # adds the TLS server block + redirect

server {
    server_name piotask.com;

    # Uploads: MAX_UPLOAD_MB defaults to 25; allow headroom.
    client_max_body_size 30m;

    # Android app download (served from disk, not the web container).
    location = /downloads/techpioasset.apk {
        alias /var/www/piotask-downloads/techpioasset.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="techpioasset.apk"';
    }

    # Which version the APK above is, written by deploy/build-apk-vps.sh. Never
    # cached: it changes with every build and exists to be believed.
    location = /downloads/techpioasset.json {
        alias /var/www/piotask-downloads/techpioasset.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # API + health endpoints → NestJS container.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> permanent home at pioassets.com. API, health and the
    # APK stay served directly: installed agents and the shipped app call this
    # host and must keep working without a redirect.
    location / {
        return 301 https://pioassets.com$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/piotask.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/piotask.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = piotask.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name piotask.com;
    return 404; # managed by Certbot


}
# www → apex. Certbot attaches the certificate to this block on --expand.
server {
    server_name www.piotask.com;
    return 301 https://piotask.com$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/piotask.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/piotask.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.piotask.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.piotask.com;
    return 404; # managed by Certbot


}