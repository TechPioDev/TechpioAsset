# nginx site for staging.pioassets.com — the same app, one port pair over
# (web 127.0.0.1:3100, api 127.0.0.1:3101).
#
# Two things production's site does not have, both deliberate:
#
#   auth_basic   Staff know pioassets.com. Nothing should let someone who
#                mistypes it land on a copy holding scrubbed-but-real-shaped
#                company data and start filing requests that go nowhere.
#
#   noindex      A second copy of the whole site is exactly what a crawler
#                would happily index and then rank against the real one.
#                Sent on every response, including the APK and JSON below.
#
# The password file is made once, on the server, and is not in this repo:
#   htpasswd -c /etc/nginx/.htpasswd-staging pioassets
#
# There is no /downloads/ APK alias here: the staging APK is a separate build
# with its own application id, distributed by hand, not from the public site.

server {
    server_name staging.pioassets.com;

    client_max_body_size 30m;

    auth_basic "PioAssets staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Matches production's exception for the one endpoint that runs AI
    # extraction. AI is mocked on staging so it will not actually take three
    # minutes - but the timeout should not be the thing that differs, or
    # staging stops being a test of production.
    location = /api/v1/invoices/upload {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The deploy script health-checks this, and a 401 from basic auth would look
    # exactly like a failed deploy. Open, and it reveals nothing.
    location /health/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot adds the listen/ssl_certificate lines here:
    #   certbot --nginx -d staging.pioassets.com
    listen 80;
    listen [::]:80;
}
